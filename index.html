<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ใจเบา · พื้นที่ดูแลใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#dbe6ef;
    --bg-bottom:#eef2f6;
    --surface:#ffffff;
    --surface-soft:#f3f7fa;
    --primary:#4a6fa5;
    --primary-dark:#2e4c73;
    --accent:#8fb8da;
    --accent-soft:#dbe9f4;
    --text:#2c3947;
    --muted:#71869b;
    --border:#dde6ee;
    --danger:#c97575;
    --success:#5f9e82;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 8px 24px rgba(46,76,115,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Sarabun',sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 45%, var(--bg-bottom) 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 48px 0;position:relative;}
  h1,h2,h3,.display{font-family:'Prompt',sans-serif;}
  button{font-family:'Sarabun',sans-serif;cursor:pointer;}
  ::selection{background:var(--accent-soft);}

.hero{
    padding:38px 24px 28px 24px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .breath-wrap{
    width:96px;height:96px;margin:0 auto 18px auto;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .breath-ring{
    position:absolute;inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, var(--accent) 60%, var(--primary) 100%);
    animation:breathe 5s ease-in-out infinite;
    box-shadow:0 10px 30px rgba(74,111,165,0.35);
  }
  @keyframes breathe{
    0%,100%{transform:scale(0.86);opacity:0.85;}
    50%{transform:scale(1.08);opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    .breath-ring{animation:none;}
  }
  .hero h1{font-size:28px;font-weight:700;color:var(--primary-dark);margin:0 0 6px 0;letter-spacing:0.5px;}
  .hero p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6;}

.section{padding:6px 20px 0 20px;}
  .eyebrow{
    font-family:'Prompt',sans-serif;
    font-size:12.5px;font-weight:600;letter-spacing:1.6px;
    color:var(--primary);text-transform:uppercase;
    margin:22px 4px 12px 4px;
  }

.card-list{display:flex;flex-direction:column;gap:10px;}
  .item-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 16px;
    display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;width:100%;
  }
  .item-card:active{transform:scale(0.98);}
  .item-icon{
    width:44px;height:44px;border-radius:12px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:21px;flex-shrink:0;
  }
  .item-body{flex:1;min-width:0;}
  .item-title{font-family:'Prompt',sans-serif;font-weight:600;font-size:15.5px;color:var(--text);margin:0 0 2px 0;}
  .item-desc{font-size:12.8px;color:var(--muted);margin:0;line-height:1.4;}
  .item-chevron{color:var(--accent);font-size:18px;flex-shrink:0;}

.view{padding:18px 20px 8px 20px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--primary);
    font-size:14px;font-weight:500;padding:8px 4px;margin-bottom:8px;
  }
  .view-title{font-size:21px;font-weight:700;color:var(--primary-dark);margin:2px 0 4px 0;}
  .view-sub{font-size:13px;color:var(--muted);margin:0 0 20px 0;line-height:1.5;}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .btn{
    border:none;border-radius:var(--radius-sm);
    padding:12px 18px;font-size:14.5px;font-weight:600;font-family:'Sarabun',sans-serif;
    width:100%;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-soft{background:var(--accent-soft);color:var(--primary-dark);}
  .btn:disabled{opacity:0.45;}
  .input{
    width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:14.5px;font-family:'Sarabun',sans-serif;color:var(--text);
    background:var(--surface-soft);
  }
  .input:focus{outline:none;border-color:var(--accent);}
  .row{display:flex;gap:10px;align-items:stretch;}
  .row>*{flex:1;}
  .muted-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .error-note{font-size:12.5px;color:var(--danger);margin-top:10px;line-height:1.5;}

.player-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent-soft);color:var(--primary-dark);
    border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;margin:3px 4px 3px 0;
  }
  .room-code{
    font-family:'Prompt',sans-serif;font-size:26px;font-weight:700;letter-spacing:4px;
    color:var(--primary-dark);text-align:center;margin:6px 0 14px 0;
  }

.board-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  @media (max-width: 420px){
    .board-grid{grid-template-columns:repeat(4,1fr);}
  }
  .board-card{
    aspect-ratio:1/1;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;background:var(--primary);color:transparent;
    border:none;transition:transform .12s ease;
  }
  .board-card.open{background:var(--surface);color:var(--text);border:1.5px solid var(--accent);}
  .board-card.matched{background:var(--success);color:#fff;opacity:0.55;}
  .board-card:active{transform:scale(0.94);}
  .board-card:disabled{opacity:0.55;cursor:not-allowed;}

.score-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .score-chip{
    background:var(--surface-soft);border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;font-size:12.5px;color:var(--text);
  }
  .score-chip.me{border-color:var(--primary);color:var(--primary-dark);font-weight:600;}

.chat-window{
    height:260px;overflow-y:auto;background:var(--surface-soft);
    border-radius:var(--radius-md);padding:14px;margin-bottom:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;}
  .msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .msg.them{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;}
  .msg-name{font-size:11px;font-weight:600;opacity:0.82;margin-bottom:4px;}
  .msg-text{white-space:pre-wrap;}

textarea.input{
    resize:none;
    min-height:44px;
    max-height:180px;
    font-family:'Sarabun',sans-serif;
    line-height:1.6;
  }

.spinner-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin:0 2px;animation:blink 1.3s infinite;}
  .spinner-dot:nth-child(2){animation-delay:.2s;}
  .spinner-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ========= helpers ========= */
async function fGet(path){ try{ const snap = await db.ref(path).get(); return snap.exists() ? snap.val() : null; }catch(e){ console.error('firebase get', path, e); return null; } }
async function fSet(path, value){ try{ await db.ref(path).set(value); return true; }catch(e){ console.error('firebase set', path, e); return false; } }
async function fDel(path){ try{ await db.ref(path).remove(); return true; }catch(e){ console.error('firebase del', path, e); return false; } }
async function fPush(path, value){ try{ await db.ref(path).push(value); return true; }catch(e){ console.error('firebase push', path, e); return false; } }
async function fIncrementScore(path){ try{ await db.ref(path).transaction(cur => (cur||0)+1); }catch(e){ console.error('firebase txn', path, e); } }

function lGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

function escapeHtml(s){ const d=document.createElement('div'); d.innerText = s ?? ''; return d.innerHTML; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function roomCode(){ const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=s[Math.floor(Math.random()*s.length)]; return c; }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function nowStr(){
  const d=new Date();
  return d.toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

const BOARD_PAIR_COUNT = 24;
const EMOJIS = [
  '😀','😎','🥳','😺','🐶','🐼','🦊','🐸','🐵','🦁','🐯','🐰',
  '🐷','🐙','🦄','🐝','🍎','🍓','🍇','🍉','⚽','🎲','🎵','🌈'
];

/* ========= state ========= */
let ME_ID = null;
let ME_NAME = null;
let view = 'home';
let pollTimer = null;
let currentRoomCode = null;
let lastError = null;
let roomChatDraft = '';

function ensureIdentity(){
  ME_NAME = lGet('nickname');
  return new Promise((resolve)=>{
    firebase.auth().onAuthStateChanged((user)=>{
      if(user){
        ME_ID = user.uid;
        resolve();
      }else{
        firebase.auth().signInAnonymously().catch((e)=>{
          console.error('anonymous sign-in failed', e);
          lastError = 'เชื่อมต่อระบบยืนยันตัวตนไม่สำเร็จ ลองรีเฟรชหน้าเว็บ';
          resolve();
        });
      }
    });
  });
}

/* ========= render ========= */
async function render(){
  const app = document.getElementById('app');
  if(view==='home') app.innerHTML = renderHome();
  else if(view==='boardgame') app.innerHTML = await renderBoardGameEntry();
  else if(view==='boardroom') app.innerHTML = await renderBoardRoom();
  bindInputHandlers();
}

function goto(v){
  view = v;
  lastError = null;
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  render();
}

/* ========= home ========= */
function renderHome(){
  return `
  <div class="hero">
    <div class="breath-wrap"><div class="breath-ring"></div></div>
    <h1>ใจเบา</h1>
    <p>พื้นที่เล็ก ๆ ที่ตั้งใจดูแลใจของคุณ<br/>เกมจับคู่, ห้องแชท, และการเล่นเป็นรอบ</p>
  </div>

<div class="section">
    <div class="eyebrow">เริ่มต้น</div>
    <div class="card-list">
      <button class="item-card" data-action="nav" data-view="boardgame">
        <div class="item-icon">🎲</div>
        <div class="item-body">
          <p class="item-title">บอร์ดเกม 48 ใบ</p>
          <p class="item-desc">จับคู่อีโมจิ เล่นแบบเป็นเทิร์น มีห้องแชทในห้องเดียวกัน</p>
        </div>
        <div class="item-chevron">›</div>
      </button>
    </div>
  </div>`;
}

/* ========= boardgame entry ========= */
async function renderBoardGameEntry(){
  return `
  <div class="view">
    <button class="back-btn" data-action="nav" data-view="home">← กลับหน้าหลัก</button>
    <h2 class="view-title">🎲 บอร์ดเกม</h2>
    <p class="view-sub">สร้างหรือเข้าห้องเพื่อเล่นเกมจับคู่ 48 ใบ พร้อมแชทในห้องเดียวกัน</p>

<div class="panel">
      <label style="font-size:13px;color:var(--muted);">ชื่อที่ใช้แสดง</label>
      <input class="input" id="nickname-input" placeholder="เช่น ฟ้าใส" value="${escapeHtml(ME_NAME||'')}" style="margin-top:6px;margin-bottom:14px;"/>

<button class="btn btn-primary" data-action="board-quickmatch">🔀 สุ่มจับคู่ห้องที่ว่าง</button>

<div style="text-align:center;color:var(--muted);font-size:12px;margin:16px 0 12px 0;">— หรือ —</div>

<label style="font-size:13px;color:var(--muted);">ตั้งชื่อห้อง</label>
      <input class="input" id="bg-roomname-input" placeholder="เช่น ห้องเพื่อนซี้" style="margin-top:6px;margin-bottom:10px;"/>

<label style="font-size:13px;color:var(--muted);">ตั้งรหัสห้องเอง</label>
      <input class="input" id="bg-customcode-input" placeholder="เช่น FUN1" maxlength="8" style="text-transform:uppercase;margin-top:6px;margin-bottom:12px;"/>

<button class="btn btn-outline" data-action="board-createroom">➕ สร้างห้องใหม่</button>

<div class="row" style="margin-top:14px;">
        <input class="input" id="bg-code-input" placeholder="กรอกรหัสห้อง" style="text-transform:uppercase;"/>
        <button class="btn btn-outline" data-action="board-joincode" style="flex:0 0 100px;">เข้าร่วม</button>
      </div>

<p class="muted-note">ห้องหนึ่งเล่นได้สูงสุด 4 คน เมื่อเริ่มเกมระบบจะล็อกเทิร์นทีละคน และในห้องมีแชทให้คุยกันได้</p>
      ${lastError ? `<p class="error-note">${escapeHtml(lastError)}</p>` : ''}
    </div>
  </div>`;
}

function makeDeck(){
  const values = [];
  for(let i=0;i<BOARD_PAIR_COUNT;i++){
    values.push(EMOJIS[i], EMOJIS[i]);
  }
  shuffle(values);
  return values.map(v => ({ value:v, matchedBy:null }));
}

async function boardQuickMatch(){
  const nick = document.getElementById('nickname-input').value.trim() || 'เพื่อนใหม่';
  ME_NAME = nick;
  lSet('nickname', nick);

const allRooms = await fGet('rooms') || {};
  let joined = null;

for(const code in allRooms){
    const room = allRooms[code];
    const players = room && room.players ? room.players : {};
    if(room && room.status === 'waiting' && Object.keys(players).length < 4 && !players[ME_ID]){
      const ok = await fSet('rooms/'+code+'/players/'+ME_ID, { name:nick, score:0 });
      if(ok){ joined = code; break; }
    }
  }

if(!joined){
    joined = roomCode();
    const cards = makeDeck();
    let ok = await fSet('rooms/'+joined+'/players/'+ME_ID, { name:nick, score:0 });
    ok = ok && await fSet('rooms/'+joined+'/code', joined);
    ok = ok && await fSet('rooms/'+joined+'/roomName', 'ห้องของ '+nick);
    ok = ok && await fSet('rooms/'+joined+'/createdAt', Date.now());
    ok = ok && await fSet('rooms/'+joined+'/cards', cards);
    ok = ok && await fSet('rooms/'+joined+'/status', 'waiting');
    ok = ok && await fSet('rooms/'+joined+'/flipped', {});
    ok = ok && await fDel('rooms/'+joined+'/pairLockBy');
    ok = ok && await fDel('rooms/'+joined+'/lockedBy');
    if(!ok){
      lastError='เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง';
      render();
      return;
    }
  }

currentRoomCode = joined;
  goto('boardroom');
}

async function boardCreateRoom(){
  const nick = document.getElementById('nickname-input').value.trim() || 'เพื่อนใหม่';
  const roomNameInput = document.getElementById('bg-roomname-input').value.trim();
  let code = document.getElementById('bg-customcode-input').value.trim().toUpperCase();

ME_NAME = nick;
  lSet('nickname', nick);

if(code){
    if(!/^[A-Z0-9]{2,8}$/.test(code)){
      lastError='รหัสห้องควรเป็น A-Z / 0-9 ยาว 2-8 ตัว';
      render();
      return;
    }
    const existing = await fGet('rooms/'+code);
    if(existing){
      lastError='รหัสห้องนี้มีคนใช้แล้ว ลองรหัสอื่น';
      render();
      return;
    }
  }else{
    code = roomCode();
  }

const cards = makeDeck();
  const roomName = roomNameInput || ('ห้องของ '+nick);

let ok = await fSet('rooms/'+code+'/players/'+ME_ID, { name:nick, score:0 });
  ok = ok && await fSet('rooms/'+code+'/code', code);
  ok = ok && await fSet('rooms/'+code+'/roomName', roomName);
  ok = ok && await fSet('rooms/'+code+'/createdAt', Date.now());
  ok = ok && await fSet('rooms/'+code+'/cards', cards);
  ok = ok && await fSet('rooms/'+code+'/status', 'waiting');
  ok = ok && await fSet('rooms/'+code+'/flipped', {});
  ok = ok && await fDel('rooms/'+code+'/pairLockBy');
  ok = ok && await fDel('rooms/'+code+'/lockedBy');

if(!ok){
    lastError='สร้างห้องไม่สำเร็จ ลองใหม่อีกครั้ง';
    render();
    return;
  }

currentRoomCode = code;
  goto('boardroom');
}

async function boardJoinCode(){
  const nick = document.getElementById('nickname-input').value.trim() || 'เพื่อนใหม่';
  const code = document.getElementById('bg-code-input').value.trim().toUpperCase();
  if(!code) return;

ME_NAME = nick;
  lSet('nickname', nick);

const room = await fGet('rooms/'+code);
  if(!room){
    lastError='ไม่พบห้องนี้ ตรวจสอบรหัสอีกครั้ง';
    render();
    return;
  }

const players = room.players || {};
  const playerCount = Object.keys(players).length;

if(room.status !== 'waiting'){
    lastError='ห้องนี้กำลังเล่นอยู่แล้ว';
    render();
    return;
  }

if(!players[ME_ID] && playerCount >= 4){
    lastError='ห้องนี้เต็มแล้ว';
    render();
    return;
  }

if(!players[ME_ID]){
    const ok = await fSet('rooms/'+code+'/players/'+ME_ID, { name:nick, score:0 });
    if(!ok){
      lastError='เข้าห้องไม่สำเร็จ ลองใหม่อีกครั้ง';
      render();
      return;
    }
  }

currentRoomCode = code;
  goto('boardroom');
}

/* ========= boardroom render ========= */
function boardSymbols(){
  return EMOJIS;
}

function topScoreInfo(players){
  const arr = Object.entries(players || {}).map(([id,p]) => ({
    id,
    name: p.name || 'ผู้เล่น',
    score: p.score || 0
  }));
  arr.sort((a,b)=>b.score-a.score);
  const topScore = arr.length ? arr[0].score : 0;
  const topPlayers = arr.filter(p => p.score === topScore);
  return { topScore, topPlayers, sorted: arr };
}

function renderBoardGrid(room){
  const cards = room.cards || [];
  const flipped = room.flipped || {};
  const myTurn = room.status === 'playing' && room.turnId === ME_ID;
  const allMatched = cards.length > 0 && cards.every(c => c.matchedBy);

return cards.map((c,i)=>{
    const isFlipped = !!flipped[i];
    const open = c.matchedBy || isFlipped;
    const cls = c.matchedBy ? 'matched' : (isFlipped ? 'open' : '');
    const disabled = (room.status !== 'playing' || allMatched || (!myTurn && !open)) ? 'disabled' : '';
    return `<button class="board-card ${cls}" ${disabled} data-action="board-flip" data-idx="${i}">${open ? c.value : ''}</button>`;
  }).join('');
}

function renderRoomMessages(room){
  const messages = Object.values(room.messages || {}).sort((a,b)=>a.time-b.time);
  if(!messages.length){
    return `<div class="msg sys">ยังไม่มีข้อความ เริ่มคุยกันได้เลย 🙂</div>`;
  }

return messages.map(m=>{
    if(m.sender === 'sys') return `<div class="msg sys">${escapeHtml(m.text)}</div>`;
    const isMe = m.sender === ME_ID;
    const name = escapeHtml(m.name || (isMe ? 'คุณ' : 'เพื่อน'));
    return `
      <div class="msg ${isMe ? 'me' : 'them'}">
        <div class="msg-name">${name}</div>
        <div class="msg-text">${escapeHtml(m.text)}</div>
      </div>
    `;
  }).join('');
}

function renderEndPanel(room){
  const cards = room.cards || [];
  const allMatched = cards.length > 0 && cards.every(c => c.matchedBy);
  if(!allMatched) return '';

const { topScore, topPlayers } = topScoreInfo(room.players || {});
  const topText = topPlayers.map(p => p.name).join(', ');

return `
    <div class="panel" id="endgame-panel" style="text-align:center;">
      <p style="font-family:Prompt;font-weight:600;font-size:17px;color:var(--primary-dark);">🎉 จบเกมแล้ว!</p>
      <p class="view-sub" style="margin:6px 0 0 0;">ผู้ที่ได้คะแนนสูงสุด: ${escapeHtml(topText)} (${topScore}★)</p>
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-outline" data-action="nav" data-view="home">กลับหน้าหลัก</button>
        <button class="btn btn-primary" data-action="board-rematch">เล่นต่อ</button>
      </div>
    </div>
  `;
}

async function renderBoardRoom(){
  const room = await fGet('rooms/'+currentRoomCode);
  if(!room){
    return `<div class="view"><button class="back-btn" data-action="nav" data-view="boardgame">← กลับ</button><p class="empty-note">ห้องนี้ถูกปิดไปแล้ว</p></div>`;
  }

if(!pollTimer){
    pollTimer = setInterval(()=>{ if(view==='boardroom') refreshBoardRoom(); }, 1200);
  }

const players = room.players || {};
  const playerIds = Object.keys(players);
  const cards = room.cards || [];
  const allMatched = cards.length > 0 && cards.every(c => c.matchedBy);
  const { sorted } = topScoreInfo(players);

return `
  <div class="view">
    <button class="back-btn" data-action="board-leave">← ออกจากห้อง</button>
    <h2 class="view-title">${escapeHtml(room.roomName || ('ห้อง '+room.code))}</h2>

<div class="room-code">${escapeHtml(room.code || '')}</div>

<div class="score-strip" id="score-strip">
      ${playerIds.map(id=>`<span class="score-chip ${id===ME_ID?'me':''}">${escapeHtml(players[id].name)}: ${players[id].score||0}★</span>`).join('')}
    </div>

<div id="turn-note" class="muted-note" style="margin-top:-2px;">
      ${room.status === 'playing'
        ? `ถึงตาของ: ${escapeHtml((players[room.turnId] && players[room.turnId].name) || '—')}`
        : `รอผู้เล่นอย่างน้อย 2 คน แล้วกดเริ่มเกม`}
    </div>

<div class="panel" style="margin-top:12px;">
      <div style="margin-bottom:8px;">
        ${playerIds.map(id=>`<span class="player-pill">🙂 ${escapeHtml(players[id].name)}${id===ME_ID?' (คุณ)':''}</span>`).join('')}
      </div>

<div class="row" style="margin-top:10px;">
        <button class="btn btn-outline" data-action="board-leave">ออกจากห้อง</button>
        <button class="btn btn-primary" data-action="board-start" ${playerIds.length < 2 || room.status !== 'waiting' ? 'disabled' : ''}>เริ่มเกม</button>
      </div>

${room.status === 'waiting' ? `<p class="muted-note" style="text-align:center;margin-bottom:0;">ตอนนี้ยังเป็นห้องรอผู้เล่น</p>` : ''}
    </div>

<div id="endgame-slot">
      ${renderEndPanel(room)}
    </div>

<div class="board-grid" id="board-grid">
      ${renderBoardGrid(room)}
    </div>

<p class="muted-note">เปิดการ์ดได้ครั้งละ 1 คนต่อเทิร์น จับคู่ให้ถูกเพื่อได้แต้ม</p>

<div class="panel">
      <div class="eyebrow" style="margin-top:0;">ห้องแชท</div>
      <div class="chat-window" id="room-chat-window">
        ${renderRoomMessages(room)}
      </div>

<div class="row">
        <textarea class="input" id="room-chat-input" placeholder="พิมพ์ข้อความ…" rows="1" enterkeyhint="send" autocapitalize="none" autocomplete="off" spellcheck="true">${escapeHtml(roomChatDraft)}</textarea>
        <button class="btn btn-primary" style="flex:0 0 90px;" data-action="room-chat-send">ส่ง</button>
      </div>
      <p class="muted-note">ชื่อผู้พิมพ์จะแสดงในแต่ละข้อความ</p>
    </div>
  </div>`;
}

async function refreshBoardRoom(){
  if(view !== 'boardroom') return;

const room = await fGet('rooms/'+currentRoomCode);
  if(!room){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    currentRoomCode = null;
    goto('boardgame');
    return;
  }

const players = room.players || {};
  const playerIds = Object.keys(players);

// normalize if somebody left
  if(room.status === 'playing'){
    if(room.turnId && !players[room.turnId] && playerIds.length){
      await fSet('rooms/'+currentRoomCode+'/turnId', playerIds[0]);
      room.turnId = playerIds[0];
    }
    if(room.pairLockBy && !players[room.pairLockBy]){
      await fDel('rooms/'+currentRoomCode+'/pairLockBy');
      room.pairLockBy = null;
    }
  }

const scoreStrip = document.getElementById('score-strip');
  if(scoreStrip){
    scoreStrip.innerHTML = playerIds.map(id=>`<span class="score-chip ${id===ME_ID?'me':''}">${escapeHtml(players[id].name)}: ${players[id].score||0}★</span>`).join('');
  }

const turnNote = document.getElementById('turn-note');
  if(turnNote){
    turnNote.innerHTML = room.status === 'playing'
      ? `ถึงตาของ: ${escapeHtml((players[room.turnId] && players[room.turnId].name) || '—')}`
      : `รอผู้เล่นอย่างน้อย 2 คน แล้วกดเริ่มเกม`;
  }

const endSlot = document.getElementById('endgame-slot');
  if(endSlot){
    endSlot.innerHTML = renderEndPanel(room);
  }

const grid = document.getElementById('board-grid');
  if(grid){
    grid.innerHTML = renderBoardGrid(room);
  }

const chatWindow = document.getElementById('room-chat-window');
  if(chatWindow){
    const nearBottom = chatWindow.scrollTop + chatWindow.clientHeight >= chatWindow.scrollHeight - 100;
    chatWindow.innerHTML = renderRoomMessages(room);
    if(nearBottom) chatWindow.scrollTop = chatWindow.scrollHeight;
  }
}

async function boardStart(){
  const room = await fGet('rooms/'+currentRoomCode);
  if(!room) return;

const players = room.players || {};
  const playerIds = Object.keys(players);
  if(playerIds.length < 2){
    lastError = 'ต้องมีผู้เล่นอย่างน้อย 2 คน';
    render();
    return;
  }

await fSet('rooms/'+currentRoomCode+'/status', 'playing');
  await fSet('rooms/'+currentRoomCode+'/turnId', playerIds[0]);
  await fSet('rooms/'+currentRoomCode+'/flipped', {});
  await fDel('rooms/'+currentRoomCode+'/pairLockBy');
  await fDel('rooms/'+currentRoomCode+'/lockedBy');
  await refreshBoardRoom();
}

async function boardFlip(idx){
  const room = await fGet('rooms/'+currentRoomCode);
  if(!room || room.status !== 'playing') return;

const cards = room.cards || [];
  const flipped = room.flipped || {};
  const card = cards[idx];
  const turnId = room.turnId || null;
  const pairLockBy = room.pairLockBy || null;

// ต้องถึงตาของคนนี้
  if(turnId && turnId !== ME_ID) return;

// ถ้าคู่กำลังถูกเปิดโดยคนอื่น ห้ามแทรก
  if(pairLockBy && pairLockBy !== ME_ID) return;

if(!card || card.matchedBy) return;
  if(flipped[idx]) return;
  if(Object.keys(flipped).length >= 2) return;

// ล็อกคู่ตั้งแต่ใบแรก
  if(!pairLockBy){
    await fSet('rooms/'+currentRoomCode+'/pairLockBy', ME_ID);
  }

await fSet('rooms/'+currentRoomCode+'/lockedBy', ME_ID);

flipped[idx] = true;
  await fSet('rooms/'+currentRoomCode+'/flipped', flipped);
  await refreshBoardRoom();

const openIdx = Object.keys(flipped).map(Number);

if(openIdx.length === 2){
    const [a,b] = openIdx;

if(cards[a].value === cards[b].value){
      // ถูกคู่: คนเดิมเล่นต่อ
      await fSet('rooms/'+currentRoomCode+'/cards/'+a+'/matchedBy', ME_ID);
      await fSet('rooms/'+currentRoomCode+'/cards/'+b+'/matchedBy', ME_ID);
      await fSet('rooms/'+currentRoomCode+'/flipped', {});
      await fIncrementScore('rooms/'+currentRoomCode+'/players/'+ME_ID+'/score');
      await fDel('rooms/'+currentRoomCode+'/pairLockBy');
      await fSet('rooms/'+currentRoomCode+'/turnId', ME_ID);
    }else{
      // ผิดคู่: ปิดไพ่และส่งตาให้คนถัดไป
      setTimeout(async ()=>{
        const room2 = await fGet('rooms/'+currentRoomCode);
        if(!room2) return;

const flipped2 = room2.flipped || {};
        const keys2 = Object.keys(flipped2).map(Number);
        if(keys2.length === 2 && keys2.includes(a) && keys2.includes(b)){
          await fSet('rooms/'+currentRoomCode+'/flipped', {});
        }

await fDel('rooms/'+currentRoomCode+'/pairLockBy');

const players2 = room2.players || {};
        const ids = Object.keys(players2);
        const currentIndex = ids.indexOf(ME_ID);
        const nextId = ids[(currentIndex + 1) % ids.length];
        await fSet('rooms/'+currentRoomCode+'/turnId', nextId);

if(view === 'boardroom') await refreshBoardRoom();
      }, 1100);
    }
  }

await fDel('rooms/'+currentRoomCode+'/lockedBy');
  await refreshBoardRoom();
}

async function boardLeave(){
  const room = await fGet('rooms/'+currentRoomCode);
  if(room){
    const players = room.players || {};
    const remaining = {...players};
    delete remaining[ME_ID];

if(Object.keys(remaining).length === 0){
      await fDel('rooms/'+currentRoomCode);
    }else{
      await fDel('rooms/'+currentRoomCode+'/players/'+ME_ID);

if(room.status === 'playing'){
        const ids = Object.keys(remaining);
        const turnWasMe = room.turnId === ME_ID;
        const lockWasMe = room.pairLockBy === ME_ID;

if(turnWasMe){
          await fSet('rooms/'+currentRoomCode+'/turnId', ids[0]);
        }
        if(lockWasMe){
          await fDel('rooms/'+currentRoomCode+'/pairLockBy');
        }
        await fDel('rooms/'+currentRoomCode+'/lockedBy');
        await fSet('rooms/'+currentRoomCode+'/flipped', {});
      }
    }
  }

currentRoomCode = null;
  roomChatDraft = '';
  goto('boardgame');
}

async function boardRematch(){
  await boardLeave();
  setTimeout(()=>{
    boardQuickMatch();
  }, 120);
}

/* ========= room chat ========= */
function bindInputHandlers(){
  const chatInput = document.getElementById('room-chat-input');
  if(chatInput){
    chatInput.oninput = (e)=>{
      roomChatDraft = e.target.value;
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
    };

chatInput.onkeydown = (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        roomChatSend();
      }
    };
  }
}

async function roomChatSend(){
  const input = document.getElementById('room-chat-input');
  const text = input ? input.value.trim() : '';
  if(!text || !currentRoomCode) return;

await fPush('rooms/'+currentRoomCode+'/messages', {
    sender: ME_ID,
    name: ME_NAME || 'ผู้เล่น',
    text,
    time: Date.now()
  });

roomChatDraft = '';
  if(input){
    input.value = '';
    input.style.height = '44px';
    input.focus({ preventScroll: true });
  }

await refreshBoardRoom();
}

/* ========= click delegation ========= */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;

const action = el.getAttribute('data-action');

if(action === 'nav') goto(el.getAttribute('data-view'));

else if(action === 'board-quickmatch') boardQuickMatch();
  else if(action === 'board-createroom') boardCreateRoom();
  else if(action === 'board-joincode') boardJoinCode();
  else if(action === 'board-start') boardStart();
  else if(action === 'board-flip') boardFlip(parseInt(el.getAttribute('data-idx')));
  else if(action === 'board-leave') boardLeave();
  else if(action === 'board-rematch') boardRematch();

else if(action === 'room-chat-send') roomChatSend();
});

/* ========= init ========= */
(async function init(){
  await ensureIdentity();
  render();
})();
</script>
