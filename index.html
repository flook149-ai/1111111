<style>
  :root{
    --bg-top:#dbe6ef;
    --bg-bottom:#eef2f6;
    --surface:#ffffff;
    --surface-soft:#f3f7fa;
    --primary:#4a6fa5;
    --primary-dark:#2e4c73;
    --accent:#8fb8da;
    --accent-soft:#dbe9f4;
    --text:#2c3947;
    --muted:#71869b;
    --border:#dde6ee;
    --danger:#c97575;
    --success:#5f9e82;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 8px 24px rgba(46,76,115,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Sarabun',sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 45%, var(--bg-bottom) 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 48px 0;position:relative;}
  h1,h2,h3,.display{font-family:'Prompt',sans-serif;}
  button{font-family:'Sarabun',sans-serif;cursor:pointer;}
  ::selection{background:var(--accent-soft);}

.hero{
    padding:38px 24px 28px 24px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .breath-wrap{
    width:96px;height:96px;margin:0 auto 18px auto;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .breath-ring{
    position:absolute;inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, var(--accent) 60%, var(--primary) 100%);
    animation:breathe 5s ease-in-out infinite;
    box-shadow:0 10px 30px rgba(74,111,165,0.35);
  }
  @keyframes breathe{
    0%,100%{transform:scale(0.86);opacity:0.85;}
    50%{transform:scale(1.08);opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    .breath-ring{animation:none;}
  }
  .hero h1{font-size:28px;font-weight:700;color:var(--primary-dark);margin:0 0 6px 0;letter-spacing:0.5px;}
  .hero p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6;}

.section{padding:6px 20px 0 20px;}
  .eyebrow{
    font-family:'Prompt',sans-serif;
    font-size:12.5px;font-weight:600;letter-spacing:1.6px;
    color:var(--primary);text-transform:uppercase;
    margin:22px 4px 12px 4px;
  }

.card-list{display:flex;flex-direction:column;gap:10px;}
  .item-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 16px;
    display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;width:100%;
  }
  .item-card:active{transform:scale(0.98);}
  .item-icon{
    width:44px;height:44px;border-radius:12px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:21px;flex-shrink:0;
  }
  .item-body{flex:1;min-width:0;}
  .item-title{font-family:'Prompt',sans-serif;font-weight:600;font-size:15.5px;color:var(--text);margin:0 0 2px 0;}
  .item-desc{font-size:12.8px;color:var(--muted);margin:0;line-height:1.4;}
  .item-chevron{color:var(--accent);font-size:18px;flex-shrink:0;}

.view{padding:18px 20px 8px 20px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--primary);
    font-size:14px;font-weight:500;padding:8px 4px;margin-bottom:8px;
  }
  .view-title{font-size:21px;font-weight:700;color:var(--primary-dark);margin:2px 0 4px 0;}
  .view-sub{font-size:13px;color:var(--muted);margin:0 0 20px 0;line-height:1.5;}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .btn{
    border:none;border-radius:var(--radius-sm);
    padding:12px 18px;font-size:14.5px;font-weight:600;font-family:'Sarabun',sans-serif;
    width:100%;

  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-soft{background:var(--accent-soft);color:var(--primary-dark);}
  .btn:disabled{opacity:0.45;}
  .input{
    width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:14.5px;font-family:'Sarabun',sans-serif;color:var(--text);

  .muted-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .error-note{font-size:12.5px;color:var(--danger);margin-top:10px;line-height:1.5;}

.player-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent-soft);color:var(--primary-dark);
    border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;margin:3px 4px 3px 0;
  }
  .room-code{
    font-family:'Prompt',sans-serif;font-size:26px;font-weight:700;letter-spacing:4px;
    color:var(--primary-dark);text-align:center;margin:6px 0 14px 0;
  }

.board-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  @media (max-width: 420px){
    .board-grid{grid-template-columns:repeat(4,1fr);}
  }
  .board-card{
    aspect-ratio:1/1;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;background:var(--primary);color:transparent;
    border:none;transition:transform .12s ease;
  }
  .board-card.open{background:var(--surface);color:var(--text);border:1.5px solid var(--accent);}
  .board-card.matched{background:var(--success);color:#fff;opacity:0.55;}
  .board-card:active{transform:scale(0.94);}
  .board-card:disabled{opacity:0.55;cursor:not-allowed;}

.score-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .score-chip{
    background:var(--surface-soft);border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;font-size:12.5px;color:var(--text);
  }
  .score-chip.me{border-color:var(--primary);color:var(--primary-dark);font-weight:600;}

.chat-window{
    height:260px;overflow-y:auto;background:var(--surface-soft);
    border-radius:var(--radius-md);padding:14px;margin-bottom:12px;
    display:flex;flex-direction:column;gap:8px;

  .msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .msg.them{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;}
  .msg-name{font-size:11px;font-weight:600;opacity:0.82;margin-bottom:4px;}
  .msg-text{white-space:pre-wrap;}

textarea.input{

    max-height:180px;
    font-family:'Sarabun',sans-serif;
    line-height:1.6;

  .entry-text{font-size:14px;line-height:1.55;white-space:pre-wrap;}
  .empty-note{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;}

.thread-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .thread-card{
    background:var(--surface);

    border-radius:var(--radius-md);
    padding:14px 15px;

  .thread-meta{
    font-size:11.5px;

  .thread-preview{
    font-size:13px;

    color:var(--text);

  .thread-badge{

  .spinner-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

<script>
/* ============ shared (Firebase) storage helpers ============ */
async function fGet(path){ try{ const snap = await db.ref(path).get(); return snap.exists() ? snap.val() : null; }catch(e){ console.error('firebase get', path, e); return null; } }
async function fSet(path, value){ try{ await db.ref(path).set(value); return true; }catch(e){ console.error('firebase set', path, e); return false; } }
async function fDel(path){ try{ await db.ref(path).remove(); return true; }catch(e){ console.error('firebase del', path, e); return false; } }
async function fPush(path, value){ try{ await db.ref(path).push(value); return true; }catch(e){ console.error('firebase push', path, e); return false; } }
async function fIncrementScore(path){ try{ await db.ref(path).transaction(cur => (cur||0)+1); }catch(e){ console.error('firebase txn', path, e); } }

/* ============ personal (localStorage) storage helpers ============ */
function lGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

function uid(){ return Math.random().toString(36).slice(2,10); }
function roomCode(){ const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=s[Math.floor(Math.random()*s.length)]; return c; }
function nowStr(){
  const d=new Date();
  return d.toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }

/* ============ app state ============ */

let view='home';
let pollTimer=null;
let currentRoomCode=null;
let currentChatCode=null;
let lastError=null;
let chatDraft='';

/* Board game state */
const BOARD_PAIR_COUNT = 24;
const BOARD_EMOJIS = [

  '🐷','🐙','🦄','🐝','🍎','🍓','🍇','🍉','⚽','🎲','🎵','🌈'
];
let boardChatDraft='';

/* Vent space state */
let ventMode = 'compose'; // compose | publicList | detail
let ventReadingId = null;

let ventDraftText = '';

function ensureIdentity(){
  ME_NAME = lGet('nickname');
  return new Promise((resolve)=>{
    firebase.auth().onAuthStateChanged((user)=>{
      if(user){
        ME_ID = user.uid;
        resolve();
      } else {
        firebase.auth().signInAnonymously().catch((e)=>{
          console.error('anonymous sign-in failed', e);
          lastError = 'เชื่อมต่อระบบยืนยันตัวตนไม่สำเร็จ ลองรีเฟรชหน้าเว็บ';
          resolve();
        });

}

/* ============ render root ============ */
async function render(){
  const app = document.getElementById('app');
  if(view==='home') app.innerHTML = renderHome();
  else if(view==='boardgame') app.innerHTML = await renderBoardGameEntry();
  else if(view==='boardroom') app.innerHTML = await renderBoardRoom();
  else if(view==='chat') app.innerHTML = await renderChatEntry();
  else if(view==='chatroom') app.innerHTML = await renderChatRoom();
  else if(view==='vent') app.innerHTML = await renderVent();
  bindEvents();
}

function goto(v){
  view=v;
  lastError=null;
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(v === 'chatroom') chatFocusDone = false;
  if(v === 'vent') { ventMode = 'compose'; ventReadingId = null; }
  render();
}

/* ============ BOARD GAME: entry ============ */
async function renderBoardGameEntry(){
  return `
  <div class="view">
    <button class="back-btn" data-action="nav" data-view="home">← กลับหน้าหลัก</button>
    <h2 class="view-title">🎲 บอร์ดเกม</h2>
    <p class="view-sub">สร้างหรือเข้าห้องเพื่อเล่นเกมจับคู่ 48 ใบ พร้อมแชทในห้องเดียวกัน</p>

<div class="panel">
      <label style="font-size:13px;color:var(--muted);">ชื่อที่ใช้แสดง</label>
      <input class="input" id="nickname-input" placeholder="เช่น ฟ้าใส" value="${escapeHtml(ME_NAME||'')}" style="margin-top:6px;margin-bottom:14px;"/>

<button class="btn btn-primary" data-action="board-quickmatch">🔀 สุ่มจับคู่ห้องที่ว่าง</button>

<div style="text-align:center;color:var(--muted);font-size:12px;margin:16px 0 12px 0;">— หรือ —</div>

<label style="font-size:13px;color:var(--muted);">ตั้งชื่อห้อง</label>
      <input class="input" id="bg-roomname-input" placeholder="เช่น ห้องเพื่อนซี้" style="margin-top:6px;margin-bottom:10px;"/>

<label style="font-size:13px;color:var(--muted);">ตั้งรหัสห้องเอง</label>
      <input class="input" id="bg-customcode-input" placeholder="เช่น FUN1" maxlength="8" style="text-transform:uppercase;margin-top:6px;margin-bottom:12px;"/>

<button class="btn btn-outline" data-action="board-createroom">➕ สร้างห้องใหม่</button>

<div class="row" style="margin-top:14px;">
        <input class="input" id="bg-code-input" placeholder="กรอกรหัสห้อง" style="text-transform:uppercase;"/>
        <button class="btn btn-outline" data-action="board-joincode" style="flex:0 0 100px;">เข้าร่วม</button>
      </div>

<p class="muted-note">ห้องหนึ่งเล่นได้สูงสุด 4 คน เมื่อเริ่มเกมระบบจะล็อกเทิร์นทีละคน และในห้องมีแชทให้คุยกันได้</p>
      ${lastError ? `<p class="error-note">${escapeHtml(lastError)}</p>` : ''}
    </div>
  </div>`;
}

function makeBoardDeck(){
  const values = [];
  for(let i=0;i<BOARD_PAIR_COUNT;i++){
    values.push(BOARD_EMOJIS[i], BOARD_EMOJIS[i]);
  }
  for(let i=values.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [values[i],values[j]]=[values[j],values[i]];
  }
  return values.map(v => ({ value:v, matchedBy:null }));
}

async function bgQuickMatch(){
  const nick = document.getElementById('nickname-input').value.trim() || 'เพื่อนใหม่';
  ME_NAME = nick;
  lSet('nickname', nick);

const allRooms = await fGet('rooms') || {};
  let joined = null;

for(const code in allRooms){
    const room = allRooms[code];
    const players = room && room.players ? room.players : {};
    if(room && room.status === 'waiting' && Object.keys(players).length < 4 && !players[ME_ID]){
      const ok = await fSet('rooms/'+code+'/players/'+ME_ID, {name:nick, score:0});
      if(ok){ joined = code; break; }
    }
  }

if(!joined){
    joined = roomCode();
    const cards = makeBoardDeck();

let ok = await fSet('rooms/'+joined+'/players/'+ME_ID, {name:nick, score:0});
    ok = ok && await fSet('rooms/'+joined+'/code', joined);
    ok = ok && await fSet('rooms/'+joined+'/roomName', 'ห้องของ '+nick);
    ok = ok && await fSet('rooms/'+joined+'/createdAt', Date.now());
    ok = ok && await fSet('rooms/'+joined+'/cards', cards);
    ok = ok && await fSet('rooms/'+joined+'/status', 'waiting');

/* ============ BOARD GAME: room ============ */
function boardTopScoreInfo(players){
  const arr = Object.entries(players || {}).map(([id,p]) => ({
    id,
    name: p.name || 'ผู้เล่น',
    score: p.score || 0
  }));
  arr.sort((a,b)=>b.score-a.score);
  const topScore = arr.length ? arr[0].score : 0;
  const topPlayers = arr.filter(p => p.score === topScore);
  return { topScore, topPlayers, sorted: arr };
}

function renderBoardRoomMessages(room){
  const messages = Object.values(room.messages || {}).sort((a,b)=>a.time-b.time);
  if(!messages.length){
    return `<div class="msg sys">ยังไม่มีข้อความ เริ่มคุยกันได้เลย 🙂</div>`;
  }

return messages.map(m=>{
    if(m.sender === 'sys') return `<div class="msg sys">${escapeHtml(m.text)}</div>`;
    const isMe = m.sender === ME_ID;
    const name = escapeHtml(m.name || (isMe ? 'คุณ' : 'เพื่อน'));
    return `
      <div class="msg ${isMe ? 'me' : 'them'}">
        <div class="msg-name">${name}</div>
        <div class="msg-text">${escapeHtml(m.text)}</div>
      </div>
    `;
  }).join('');
}

function renderBoardEndPanel(room){
  const cards = room.cards || [];
  const allMatched = cards.length > 0 && cards.every(c => c.matchedBy);
  if(!allMatched) return '';

const { topScore, topPlayers } = boardTopScoreInfo(room.players || {});
  const topText = topPlayers.map(p => p.name).join(', ');

return `
    <div class="panel" id="board-end-panel" style="text-align:center;">
      <p style="font-family:Prompt;font-weight:600;font-size:17px;color:var(--primary-dark);">🎉 จบเกมแล้ว!</p>
      <p class="view-sub" style="margin:6px 0 0 0;">ผู้ที่ได้คะแนนสูงสุด: ${escapeHtml(topText)} (${topScore}★)</p>
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-outline" data-action="board-leave">กลับหน้าหลัก</button>
        <button class="btn btn-primary" data-action="board-rematch">เล่นต่อ</button>
      </div>
    </div>
  `;
}

function renderBoardGrid(room){
  const cards = room.cards || [];
  const flipped = room.flipped || {};
  const myTurn = room.status === 'playing' && room.turnId === ME_ID;
  const allMatched = cards.length > 0 && cards.every(c => c.matchedBy);

return cards.map((c,i)=>{
    const isFlipped = !!flipped[i];
    const open = c.matchedBy || isFlipped;
    const cls = c.matchedBy ? 'matched' : (isFlipped ? 'open' : '');
    const disabled = (room.status !== 'playing' || allMatched || (!myTurn && !open)) ? 'disabled' : '';
    return `<button class="board-card ${cls}" ${disabled} data-action="board-flip" data-idx="${i}">${open ? c.value : ''}</button>`;
  }).join('');
}

async function bgFlip(idx){
  const room = await fGet('rooms/'+currentRoomCode);
  if(!room || room.status !== 'playing') return;

const cards = room.cards || [];
  const flipped = room.flipped || {};
  const card = cards[idx];
  const turnId = room.turnId || null;
  const pairLockBy = room.pairLockBy || null;

if(turnId && turnId !== ME_ID) return;
  if(pairLockBy && pairLockBy !== ME_ID) return;

if(!card || card.matchedBy) return;
  if(flipped[idx]) return;
  if(Object.keys(flipped).length >= 2) return;

if(!pairLockBy){
    await fSet('rooms/'+currentRoomCode+'/pairLockBy', ME_ID);
  }

await fSet('rooms/'+currentRoomCode+'/lockedBy', ME_ID);

flipped[idx] = true;
  await fSet('rooms/'+currentRoomCode+'/flipped', flipped);
  await refreshBoardRoom();

const openIdx = Object.keys(flipped).map(Number);

if(openIdx.length === 2){
    const [a,b] = openIdx;

if(cards[a].value === cards[b].value){
      await fSet('rooms/'+currentRoomCode+'/cards/'+a+'/matchedBy', ME_ID);
      await fSet('rooms/'+currentRoomCode+'/cards/'+b+'/matchedBy', ME_ID);
      await fSet('rooms/'+currentRoomCode+'/flipped', {});
      await fIncrementScore('rooms/'+currentRoomCode+'/players/'+ME_ID+'/score');
      await fDel('rooms/'+currentRoomCode+'/pairLockBy');
      await fSet('rooms/'+currentRoomCode+'/turnId', ME_ID);
    } else {
      setTimeout(async ()=>{
        const room2 = await fGet('rooms/'+currentRoomCode);
        if(!room2) return;

const flipped2 = room2.flipped || {};
        const keys2 = Object.keys(flipped2).map(Number);
        if(keys2.length === 2 && keys2.includes(a) && keys2.includes(b)){
          await fSet('rooms/'+currentRoomCode+'/flipped', {});
        }

await fDel('rooms/'+currentRoomCode+'/pairLockBy');

const players2 = room2.players || {};
        const ids = Object.keys(players2);
        const currentIndex = ids.indexOf(ME_ID);
        const nextId = ids[(currentIndex + 1) % ids.length];
        await fSet('rooms/'+currentRoomCode+'/turnId', nextId);

if(view === 'boardroom') await refreshBoardRoom();
      }, 1100);
    }
  }

await fDel('rooms/'+currentRoomCode+'/lockedBy');
  await refreshBoardRoom();
}

async function bgLeave(){
  const room = await fGet('rooms/'+currentRoomCode);
  if(room){
    const players = room.players || {};
    const remaining = {...players};
    delete remaining[ME_ID];

if(Object.keys(remaining).length === 0){
      await fDel('rooms/'+currentRoomCode);
    } else {
      await fDel('rooms/'+currentRoomCode+'/players/'+ME_ID);

if(room.status === 'playing'){
        const ids = Object.keys(remaining);
        const turnWasMe = room.turnId === ME_ID;
        const lockWasMe = room.pairLockBy === ME_ID;

if(turnWasMe){
          await fSet('rooms/'+currentRoomCode+'/turnId', ids[0]);
        }
        if(lockWasMe){
          await fDel('rooms/'+currentRoomCode+'/pairLockBy');
        }
        await fDel('rooms/'+currentRoomCode+'/lockedBy');
        await fSet('rooms/'+currentRoomCode+'/flipped', {});
      }
    }
  }

currentRoomCode = null;
  boardChatDraft = '';
  goto('boardgame');
}

async function chatFind(){
  const nick = document.getElementById('chat-nick-input').value.trim() || 'เพื่อนนิรนาม';
  ME_NAME = nick;
  lSet('nickname', nick);

const allWaiting = await fGet('chatwait') || {};
  let partnerId = null;
  let partnerData = null;

for(const id in allWaiting){
    if(id === ME_ID) continue;
    const w = allWaiting[id];
    if(w && w.status === 'waiting' && Date.now() - (w.createdAt || 0) < 5 * 60 * 1000){
      const ref = db.ref('chatwait/'+id);
      const claimed = await ref.transaction(cur => {
        if(!cur) return;
        if(cur.status !== 'waiting') return;
        if(cur.claimedBy) return;
        cur.claimedBy = ME_ID;
        return cur;
      });

if(claimed.committed && claimed.snapshot.val() && claimed.snapshot.val().claimedBy === ME_ID){
        partnerId = id;
        partnerData = claimed.snapshot.val();
        break;
      }
    }
  }

if(partnerData){
    const code = roomCode();
    const room = {
      code,
      players:{
        [partnerId]:{name:partnerData.name},
        [ME_ID]:{name:nick}
      },
      messages:{}
    };

await fSet('chatrooms/'+code, room);
    await fPush('chatrooms/'+code+'/messages', {
      sender:'sys',
      text:'เริ่มบทสนทนาแล้ว กล่าวทักทายกันได้เลย 🙂',
      time:Date.now()
    });

await fSet('chatwait/'+partnerId, {
      name:partnerData.name,
      status:'matched',
      roomCode:code
    });
    await fDel('chatwait/'+ME_ID);

currentChatCode = code;
    chatDraft = '';
    chatFocusDone = false;
    goto('chatroom');
  } else {
    await fSet('chatwait/'+ME_ID, {
      name:nick,
      status:'waiting',
      roomCode:null,
      createdAt: Date.now()
    });
    render();
  }
}

if(!pollTimer){
    pollTimer = setInterval(()=>{
      refreshChatRoom();
    }, 1200);
  }

const players = room.players || {};
  const partnerId = Object.keys(players).find(id => id !== ME_ID);
  const partnerName = partnerId ? players[partnerId].name : 'เพื่อน';
  const messages = Object.values(room.messages || {}).sort((a,b)=>a.time-b.time);

return `
  <div class="view">
    <button class="back-btn" data-action="chat-leave">← ออกจากบทสนทนา</button>
    <h2 class="view-title" id="chat-title">💬 คุยกับ ${escapeHtml(partnerName)}</h2>

<div class="chat-window" id="chat-window">
      ${renderChatMessages(messages, ME_ID)}
    </div>

<div class="row">
      <textarea class="input" id="chat-msg-input" placeholder="พิมพ์ข้อความ…" rows="1" enterkeyhint="send" autocapitalize="none" autocomplete="off" spellcheck="true">${escapeHtml(chatDraft)}</textarea>
      <button class="btn btn-primary" data-action="chat-send" style="flex:0 0 84px;">ส่ง</button>
    </div>
  </div>`;
}

async function chatSend(){
  const input = document.getElementById('chat-msg-input');
  const text = input ? input.value.trim() : '';
  if(!text) return;

await fPush('chatrooms/'+currentChatCode+'/messages', {
    sender: ME_ID,
    name: ME_NAME || 'ผู้เล่น',
    text,
    time: Date.now()
  });

chatDraft = '';
  if(input){
    input.value = '';
    input.style.height = 'auto';
    input.focus({ preventScroll: true });
  }

await refreshChatRoom();
  setTimeout(()=>{
    const w = document.getElementById('chat-window');
    if(w) w.scrollTop = w.scrollHeight;
  }, 30);
}

async function chatLeave(){
  if(currentChatCode){
    const room = await fGet('chatrooms/'+currentChatCode);
    if(room && room.players && room.players[ME_ID]){
      await fDel('chatrooms/'+currentChatCode+'/players/'+ME_ID);
      const remaining = await fGet('chatrooms/'+currentChatCode+'/players');
      if(!remaining || Object.keys(remaining).length===0){
        await fDel('chatrooms/'+currentChatCode);
      }
    }
  }

chatDraft='';
  currentChatCode=null;
  chatFocusDone=false;
  goto('home');
}

/* ============ VENT SPACE ============ */
function ventLoadPrivateThreads(){
  const raw = lGet('vent_private_threads');
  if(!raw) return [];
  try{ return JSON.parse(raw) || []; }catch(e){ return []; }
}

function ventSavePrivateThreads(items){
  lSet('vent_private_threads', JSON.stringify(items || []));
}

function ventPreview(text, len=120){
  const s = (text || '').trim();
  return s.length > len ? s.slice(0, len) + '…' : s;
}

function ventFormatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString('th-TH', {
    day:'numeric',
    month:'short',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

async function renderVent(){
  if(ventMode === 'detail' && ventReadingId){
    const thread = await fGet('ventThreads/'+ventReadingId);
    if(!thread){
      ventMode = 'publicList';
      ventReadingId = null;
      return await renderVent();
    }

return `
      <div class="view">
        <button class="back-btn" data-action="vent-back-list">← กลับไปยังรายการกระทู้</button>
        <h2 class="view-title">📝 กระทู้สาธารณะ</h2>

<div class="panel">
          <div class="thread-title">
            ${escapeHtml(thread.title || 'ไม่ระบุหัวข้อ')}
            <span class="thread-badge public">สาธารณะ</span>
          </div>
          <div class="thread-meta">
            โดย ${escapeHtml(thread.authorName || 'ไม่ระบุชื่อ')} · ${ventFormatTime(thread.createdAt)}
          </div>
          <div class="thread-preview">${escapeHtml(thread.text || '')}</div>
        </div>
      </div>
    `;
  }

if(ventMode === 'publicList'){
    const all = await fGet('ventThreads') || {};
    const items = Object.entries(all)
      .map(([id,t]) => ({ id, ...t }))
      .filter(t => t.visibility === 'public' && t.authorId !== ME_ID)
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

return `
      <div class="view">
        <button class="back-btn" data-action="vent-back-compose">← กลับไปเขียนกระทู้</button>
        <h2 class="view-title">📖 กระทู้ที่คนอื่นเคยตั้ง</h2>
        <p class="view-sub">อ่านกระทู้สาธารณะที่ผู้เล่นคนอื่นตั้งไว้</p>

${items.length === 0 ? `
          <p class="empty-note">ยังไม่มีกระทู้สาธารณะจากคนอื่น</p>
        ` : `
          <div class="thread-list">
            ${items.map(t => `
              <button class="thread-card" data-action="vent-open-thread" data-id="${escapeHtml(t.id)}">
                <div class="thread-title">
                  ${escapeHtml(t.title || 'ไม่ระบุหัวข้อ')}
                  <span class="thread-badge public">สาธารณะ</span>
                </div>
                <div class="thread-meta">
                  โดย ${escapeHtml(t.authorName || 'ไม่ระบุชื่อ')} · ${ventFormatTime(t.createdAt)}
                </div>
                <div class="thread-preview">${escapeHtml(ventPreview(t.text || ''))}</div>
              </button>
            `).join('')}
          </div>
        `}
      </div>
    `;
  }

const privateThreads = ventLoadPrivateThreads().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

return `
    <div class="view">
      <button class="back-btn" data-action="nav" data-view="home">← กลับหน้าหลัก</button>
      <h2 class="view-title">📝 พื้นที่ระบาย</h2>
      <p class="view-sub">เขียนเป็นกระทู้ได้ เลือกให้เป็นส่วนตัวหรือสาธารณะก็ได้</p>

<div class="panel">
        <label style="font-size:13px;color:var(--muted);">หัวข้อกระทู้</label>
        <input class="input" id="vent-title-input" placeholder="เช่น วันนี้เหนื่อยมาก" value="${escapeHtml(ventDraftTitle)}" style="margin-top:6px;margin-bottom:12px;"/>

<label style="font-size:13px;color:var(--muted);">เนื้อหากระทู้</label>
        <textarea class="input" id="vent-text-input" placeholder="เล่าเรื่องที่อยู่ในใจได้ตรงนี้..." style="margin-top:6px;margin-bottom:12px;min-height:120px;">${escapeHtml(ventDraftText)}</textarea>

<label style="font-size:13px;color:var(--muted);">การมองเห็น</label>
        <select class="input" id="vent-vis-input" style="margin-top:6px;margin-bottom:12px;">
          <option value="private" ${ventDraftVisibility==='private'?'selected':''}>ส่วนตัว (เก็บในเครื่องนี้)</option>
          <option value="public" ${ventDraftVisibility==='public'?'selected':''}>สาธารณะ (ให้คนอื่นอ่านได้)</option>
        </select>

<button class="btn btn-primary" data-action="vent-save">บันทึกกระทู้</button>
        <button class="btn btn-soft" style="margin-top:8px;" data-action="vent-open-public">อ่านกระทู้ที่มีคนอื่นเคยตั้ง</button>

<p class="muted-note" style="margin-bottom:0;">
          ส่วนตัว = เก็บไว้ในเครื่องคุณ · สาธารณะ = เก็บบน Firebase ให้คนอื่นอ่านได้
        </p>
        ${lastError ? `<p class="error-note">${escapeHtml(lastError)}</p>` : ''}
      </div>

<div class="panel">
        <div class="eyebrow" style="margin-top:0;">กระทู้ส่วนตัวของคุณ</div>
        ${privateThreads.length === 0 ? `
          <p class="empty-note" style="padding:10px 0;">ยังไม่มีกระทู้ส่วนตัว</p>
        ` : `
          <div class="thread-list">
            ${privateThreads.map(t => `
              <div class="thread-card">
                <div class="thread-title">
                  ${escapeHtml(t.title || 'ไม่ระบุหัวข้อ')}
                  <span class="thread-badge private">ส่วนตัว</span>
                </div>
                <div class="thread-meta">${ventFormatTime(t.createdAt)}</div>
                <div class="thread-preview">${escapeHtml(ventPreview(t.text || ''))}</div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}

async function ventSaveThread(){
  const titleEl = document.getElementById('vent-title-input');
  const textEl = document.getElementById('vent-text-input');
  const visEl = document.getElementById('vent-vis-input');

const title = (titleEl ? titleEl.value.trim() : '') || 'ไม่ระบุหัวข้อ';
  const text = (textEl ? textEl.value.trim() : '');
  const visibility = (visEl ? visEl.value : 'private');

if(!text){
    lastError = 'กรุณาใส่เนื้อหากระทู้';
    render();
    return;
  }

const payload = {
    title,
    text,
    authorId: ME_ID,
    authorName: ME_NAME || 'ผู้เล่น',
    visibility,
    createdAt: Date.now()
  };

if(visibility === 'public'){
    const ref = db.ref('ventThreads').push();
    await ref.set(payload);
  } else {
    const items = ventLoadPrivateThreads();
    items.push({
      id: uid(),
      ...payload
    });
    ventSavePrivateThreads(items);
  }

ventDraftTitle = '';
  ventDraftText = '';
  ventDraftVisibility = 'private';
  lastError = null;
  render();
}

async function ventOpenPublicList(){
  ventMode = 'publicList';
  ventReadingId = null;
  render();
}

async function ventBackCompose(){
  ventMode = 'compose';
  ventReadingId = null;
  render();
}

async function ventBackList(){
  ventMode = 'publicList';
  ventReadingId = null;
  render();
}

async function ventOpenThread(id){
  ventMode = 'detail';
  ventReadingId = id;
  render();
}

/* ============ event binding ============ */
function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = async ()=>{
      const action = el.getAttribute('data-action');
      if(action==='ext') window.open(el.getAttribute('data-url'), '_blank');
      else if(action==='nav') goto(el.getAttribute('data-view'));
      else if(action==='board-quickmatch') bgQuickMatch();
      else if(action==='board-createroom') bgCreateRoom();
      else if(action==='board-joincode') bgJoinCode();
      else if(action==='board-start') bgStart();
      else if(action==='board-flip') bgFlip(parseInt(el.getAttribute('data-idx')));
      else if(action==='board-leave') bgLeave();
      else if(action==='board-rematch') bgRematch();
      else if(action==='board-chat-send') boardChatSend();
      else if(action==='chat-find') chatFind();
      else if(action==='chat-cancel') chatCancel();
      else if(action==='chat-send') chatSend();
      else if(action==='chat-leave') chatLeave();
      else if(action==='vent-save') ventSaveThread();
      else if(action==='vent-open-public') ventOpenPublicList();
      else if(action==='vent-back-compose') ventBackCompose();
      else if(action==='vent-back-list') ventBackList();
      else if(action==='vent-open-thread') ventOpenThread(el.getAttribute('data-id'));
    };
  });

const chatInput = document.getElementById('chat-msg-input');
  if(chatInput){
    chatInput.oninput = (e)=>{
      chatDraft = e.target.value;
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
    };

chatInput.onkeydown = (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        chatSend();
      }
    };

if(view === 'chatroom' && !chatFocusDone){
      chatFocusDone = true;
      setTimeout(()=>{
        chatInput.focus({ preventScroll: true });
      }, 0);
    }
  }

const boardChatInput = document.getElementById('board-chat-input');
  if(boardChatInput){
    boardChatInput.oninput = (e)=>{
      boardChatDraft = e.target.value;
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
    };

boardChatInput.onkeydown = (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        boardChatSend();
      }
    };
  }
}

/* ============ init ============ */
(async function init(){
  await ensureIdentity();
  render();
})();
</script>
</body>
</html>
